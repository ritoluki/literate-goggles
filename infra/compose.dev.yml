services:
  postgres:
    image: postgres:17.6
    environment:
      POSTGRES_DB: bangon
      POSTGRES_USER: bangon
      POSTGRES_PASSWORD: bangon_local_only
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - bangon-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bangon -d bangon"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7.4.5
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - bangon-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  mailpit:
    image: axllent/mailpit:v1.26.0
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"

volumes:
  bangon-postgres:
  bangon-redis:
